name: Hämta nytt från YouTube

on:
  # Den nattliga schemaläggningen togs bort 2026-09-20: Umbraco-sajten
  # (Isaczzon/Bibelbecca) hämtar själv från YouTube och är enda källan.
  # Kan fortfarande köras för hand om repot någon gång skulle behövas igen.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hamta-nytt
  cancel-in-progress: false

jobs:
  hamta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Hämta nya inslag
        run: node scripts/hamta-nytt.mjs
      - name: Committa om något är nytt
        run: |
          if [[ -n "$(git status --porcelain src/media src/_data/sajt)" ]]; then
            git config user.name "bibelbecca-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/media src/_data/sajt
            git commit -m "Auto: nya inslag och följarsiffror från YouTube"
            git push
          else
            echo "Inget nytt idag."
          fi
