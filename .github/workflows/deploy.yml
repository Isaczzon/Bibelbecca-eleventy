name: Bygg och publicera till GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Bygg om varje natt efter att "Hämta nytt från YouTube" (03:30) kört –
    # commits gjorda med GITHUB_TOKEN triggar inte push-bygget automatiskt
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx @11ty/eleventy
        env:
          PATH_PREFIX: /Bibelbecca-eleventy/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
